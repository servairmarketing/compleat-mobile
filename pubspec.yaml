name: compleat_mobile
description: Com-Pleat Inventory Management Mobile App
publish_to: 'none'
version: 1.0.45+46

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  url_launcher: ^6.2.5
  dropdown_search: ^5.0.6
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  connectivity_plus: ^5.0.1
  intl: ^0.18.1
  package_info_plus: ^4.2.0
  dio: ^5.4.0
  open_filex: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.5.0
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo-compleat.jpg
    - assets/images/logo-servair.jpg
    - assets/images/ComPleat_Logo_Mark.png

patrol:
  app_name: compleat_mobile
  test_directory: integration_test
  android:
    # Patrol jobs always build the `test` Android flavor (applicationIdSuffix .test),
    # so the runtime applicationId Patrol instruments is com.compleat.compleat_mobile.test.
    package_name: com.compleat.compleat_mobile.test
