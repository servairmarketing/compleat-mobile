name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    # LIVE (prod) channel — PROMOTION ONLY (Joe's release model, 2026-07-04):
    # test runs ahead of live; live gets a release only as a deliberate act.
    # Manual trigger only — a push to main must NEVER publish to live users.
    #
    # GOOGLE PLAY (Joe's rulings 2026-10-01, docs/PLAY_INTERNAL_DISTRIBUTION_PLAN_2026-09-28.md
    # D1–D7): the LIVE channel is Google Play INTERNAL TESTING. This job
    # builds a signed Android App Bundle (AAB, Play's required format),
    # always uploads it as the workflow artifact `compleat-mobile-aab`, and —
    # ONLY when the repo VARIABLE PLAY_WIF_PROVIDER exists — pushes it to the
    # Play `internal` track. Until the variable is added the Play step is
    # skipped (not failed), so this workflow is safe to run before the
    # console work is finished; the AAB artifact is what Joe uploads by hand
    # for the one-time first release (Play's API cannot create it).
    #
    # KEYLESS AUTH (2026-10-02, plan §7.3.2): the organization policy
    # iam.disableServiceAccountKeyCreation forbids JSON keys for the
    # play-publisher service account, so there is NO stored Google credential.
    # The job mints a short-lived GitHub OIDC token (permissions: id-token)
    # and exchanges it, via the Workload Identity Federation provider named in
    # PLAY_WIF_PROVIDER, for a ~1 h access token impersonating play-publisher.
    # The service account trusts ONLY this repository
    # (roles/iam.workloadIdentityUser on attribute.repository/servairmarketing/compleat-mobile).
    # D3: the GitHub Release + APK is KEPT as the emergency sideload fallback
    # (same signing key as Play → installs over a Play install); retire it
    # after two clean Play releases.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # GitHub OIDC token for the keyless Google auth step
    env:
      # Presence check evaluated once here (same pattern as compleat-sales
      # HAS_KEYSTORE). PLAY_WIF_PROVIDER is a repo VARIABLE (not a secret —
      # the provider name is public-safe); value = the full resource name
      # projects/<number>/locations/global/workloadIdentityPools/github/providers/github-oidc
      HAS_PLAY_WIF: ${{ vars.PLAY_WIF_PROVIDER != '' }}
      PLAY_SERVICE_ACCOUNT: play-publisher@project-f05aa3b5-e37d-4c19-a03.iam.gserviceaccount.com
      PLAY_PACKAGE_NAME: com.compleat.compleat_mobile
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/compleat-release.jks
      - run: flutter pub get
      - name: Run unit tests
        # Parity with the TEST job: a red test must never reach Play or the
        # GitHub Release.
        run: flutter test --reporter expanded
      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "Version: $VERSION  versionCode: $BUILD_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Build signed App Bundle (AAB) for Google Play
        # versionCode = the pubspec `+N`; Play requires it to INCREASE on every
        # upload — a forgotten bump fails the Play step with "version code
        # already used" and nothing reaches devices.
        run: |
          flutter build appbundle --release --flavor prod \
            --dart-define=KEYSTORE_PATH=compleat-release.jks
          ls -l build/app/outputs/bundle/prodRelease/
        env:
          STORE_FILE: compleat-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: compleat-mobile-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
      - name: Authenticate to Google Cloud (keyless — Workload Identity Federation)
        # Writes a short-lived external-account credential file for the
        # play-publisher service account; no key is stored anywhere. Pinned
        # to google-github-actions/auth v3.0.0 (node24, 2026). Skipped until
        # the repo variable PLAY_WIF_PROVIDER exists (plan §7.3.2).
        if: env.HAS_PLAY_WIF == 'true'
        id: gcp-auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Upload to Google Play (internal testing track)
        # Skipped (not failed) until the repo variable PLAY_WIF_PROVIDER
        # exists — plan §7.3.2. Service account: play-publisher@… (LIVE
        # project), invited into the Play Console with "Release to testing
        # tracks" on Com-Pleat IMS only. Pinned to the newest v1.x tag of
        # r0adkll/upload-google-play (v1.1.5, 2026-04-21); its
        # `serviceAccountJson` input is just a path handed to Google's auth
        # library, which accepts the federated credential file above
        # (verified by reading v1.1.5 src/main.ts + src/edits.ts).
        if: env.HAS_PLAY_WIF == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed
          releaseName: ${{ steps.version.outputs.build_number }} (${{ steps.version.outputs.version }})
      - name: Play upload skipped (no PLAY_WIF_PROVIDER variable yet)
        if: env.HAS_PLAY_WIF != 'true'
        run: |
          echo "::notice::Repo variable PLAY_WIF_PROVIDER is not set — the AAB was NOT uploaded to Google Play." \
               "Download the compleat-mobile-aab artifact and upload it in the Play Console (plan §3 step E)."
      - name: Build signed APK (GitHub Release fallback, D3)
        run: |
          flutter build apk --release --flavor prod \
            --dart-define=KEYSTORE_PATH=compleat-release.jks
        env:
          STORE_FILE: compleat-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Create GitHub release (fallback sideload APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Version: $VERSION"
          gh release delete "v$VERSION" --yes 2>/dev/null || true
          gh release create "v$VERSION" \
            build/app/outputs/flutter-apk/app-prod-release.apk \
            --title "Compleat IMS v$VERSION" \
            --notes "Build $GITHUB_SHA" \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: compleat-mobile-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk

  build-test-apk:
    # TEST channel — runs on EVERY push to main (and on manual dispatch).
    # Builds the qa flavor (applicationIdSuffix .test, side-by-side install,
    # TEST icon/theme) pointed at the test Cloud Run backend, and publishes
    # it as a GitHub PRE-RELEASE tagged test-vX.Y.Z. The test app's update
    # checker follows only test-v* tags; the live app uses /releases/latest,
    # which never returns pre-releases — dev builds cannot reach live users.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/compleat-release.jks
      - run: flutter pub get
      - name: Run unit tests
        # Joe's ruling 2026-09-25: the detector unit tests (test/) must EXECUTE
        # in CI — no local Flutter runs in Cloud Shell. Runs before the build,
        # so a red test never publishes a test-v* pre-release.
        run: flutter test --reporter expanded
      - name: Build signed test APK
        run: |
          flutter build apk --release --flavor qa \
            --dart-define=KEYSTORE_PATH=compleat-release.jks \
            --dart-define=API_BASE=https://compleat-inventory-api-477414435007.northamerica-northeast2.run.app \
            --dart-define=APP_ENV=test
        env:
          STORE_FILE: compleat-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Rename qa APK to user-facing test name
        run: |
          mv build/app/outputs/flutter-apk/app-qa-release.apk \
             build/app/outputs/flutter-apk/app-test-release.apk
      - name: Publish test channel pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "Test channel version: $VERSION"
          gh release delete "test-v$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "test-v$VERSION" \
            build/app/outputs/flutter-apk/app-test-release.apk \
            --prerelease \
            --title "Compleat IMS TEST v$VERSION" \
            --notes "Test channel build $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: app-test-release.apk
          path: build/app/outputs/flutter-apk/app-test-release.apk

  build-patrol-test-apk:
    # Builds one Patrol APK pair per scenario file in integration_test/.
    # Patrol's PatrolJUnitRunner is designed for Android Test Orchestrator
    # (one test per process); without ATO, a bundled multi-test APK 500s on
    # every test past the first. So instead of bundling, we matrix-build:
    # one --target per scenario, one APK pair per scenario, uploaded under
    # the artifact name pattern app-patrol-<debug|androidTest>-<scenario>.apk
    # so the laptop runner can discover and run each pair sequentially.
    #
    # Manual trigger only -- patrol_cli + native instrumentation across 5
    # parallel jobs is heavier than a regular build.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - s001_login_test
          - s010_receive_happy_test
          - s011_receive_duplicate_test
          - s012_receive_missing_fields_test
          - s013_receive_crepe_interlock_test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - name: Install patrol_cli
        run: dart pub global activate patrol_cli
      - name: Build Patrol APKs for ${{ matrix.scenario }}
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          patrol build android --flavor qa \
            --target=integration_test/${{ matrix.scenario }}.dart \
            --dart-define=API_BASE=https://compleat-inventory-api-477414435007.northamerica-northeast2.run.app \
            --dart-define=APP_ENV=test
      - uses: actions/upload-artifact@v4
        with:
          name: app-patrol-debug-${{ matrix.scenario }}.apk
          path: build/app/outputs/apk/qa/debug/app-qa-debug.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: app-patrol-androidTest-${{ matrix.scenario }}.apk
          path: build/app/outputs/apk/androidTest/qa/debug/app-qa-debug-androidTest.apk
          if-no-files-found: warn
