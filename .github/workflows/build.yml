name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/compleat-release.jks
      - run: flutter pub get
      - name: Build signed APK
        run: |
          flutter build apk --release --flavor prod \
            --dart-define=KEYSTORE_PATH=compleat-release.jks
        env:
          STORE_FILE: compleat-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Get version and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "Version: $VERSION"
          gh release delete "v$VERSION" --yes 2>/dev/null || true
          gh release create "v$VERSION" \
            build/app/outputs/flutter-apk/app-prod-release.apk \
            --title "Compleat IMS v$VERSION" \
            --notes "Build $GITHUB_SHA" \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: compleat-mobile-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk

  build-test-apk:
    # Builds a test-environment APK that points at the test Cloud Run backend.
    # Uses the `test` product flavor (applicationIdSuffix .test) so it installs
    # alongside the prod APK on the same device with its own data + icon.
    # Triggered by the same events as `build` so every push produces both APKs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/compleat-release.jks
      - run: flutter pub get
      - name: Build signed test APK
        run: |
          flutter build apk --release --flavor qa \
            --dart-define=KEYSTORE_PATH=compleat-release.jks \
            --dart-define=API_BASE=https://compleat-inventory-api-477414435007.northamerica-northeast2.run.app \
            --dart-define=APP_ENV=test
        env:
          STORE_FILE: compleat-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Rename qa APK to user-facing test name
        run: |
          mv build/app/outputs/flutter-apk/app-qa-release.apk \
             build/app/outputs/flutter-apk/app-test-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-test-release.apk
          path: build/app/outputs/flutter-apk/app-test-release.apk

  build-patrol-test-apk:
    # Builds Patrol-instrumented debug APK + androidTest APK for E2E runs on
    # the Tera P60. Manual trigger only — won't run on every push, since
    # patrol_cli + native instrumentation are heavier than a regular build.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - name: Install patrol_cli
        run: dart pub global activate patrol_cli
      - name: Build Patrol APKs
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          # all_test.dart aggregates every integration_test/*_test.dart
          # main() into one entry point. patrol_cli only accepts one
          # --target, and a single APK pair keeps Tera P60 runs simple.
          patrol build android --flavor qa \
            --target=integration_test/all_test.dart \
            --dart-define=API_BASE=https://compleat-inventory-api-477414435007.northamerica-northeast2.run.app \
            --dart-define=APP_ENV=test
      - uses: actions/upload-artifact@v4
        with:
          name: app-patrol-debug.apk
          path: build/app/outputs/apk/qa/debug/app-qa-debug.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: app-patrol-androidTest.apk
          path: build/app/outputs/apk/androidTest/qa/debug/app-qa-debug-androidTest.apk
          if-no-files-found: warn
